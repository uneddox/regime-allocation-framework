[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "regime-allocation-framework"
version = "0.2.0"
description = "A reproducible four-stage macro, financial, bond-sleeve, and country-factor allocation framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Regime Allocation Framework contributors" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
regime-allocation = "regime_allocation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_allocation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
